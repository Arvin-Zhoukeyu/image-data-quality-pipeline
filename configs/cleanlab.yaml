experiment:
  seed: 42
  noise_level: noise_20

data:
  data_dir: data
  noise_root: outputs/noisy_labels
  num_classes: 10

cross_validation:
  num_folds: 5
  epochs_per_fold: 10
  batch_size: 128
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.0001

cleanlab:
  filter_by: prune_by_noise_rate
  rank_by: self_confidence

output:
  predictions_dir: outputs/predictions
  cleanlab_dir: outputs/cleanlab
  figures_dir: outputs/figures
