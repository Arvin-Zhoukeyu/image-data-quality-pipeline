project:
  name: image-data-quality-pipeline
  seed: 42

data:
  data_dir: data
  noise_root: outputs/noisy_labels
  validation_ratio: 0.1
  batch_size: 128
  num_workers: 0
  pin_memory: true

model:
  name: simple_cnn
  num_classes: 10
  dropout: 0.3

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0
  early_stopping_patience: 5

scheduler:
  factor: 0.5
  patience: 2
  minimum_learning_rate: 0.000001

output:
  checkpoint_dir: outputs/checkpoints
  training_dir: outputs/training